<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>mokoji OLED Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap');

        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --border: #222;
            --text: #888;
            --text-hi: #ccc;
            --accent: #4af;
            --oled-on: #c8e8ff;
            --oled-off: #050d14;
            --oled-border: #1a3a5a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            min-height: 100vh;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-hi);
            letter-spacing: .08em;
        }

        #status {
            font-size: 11px;
            color: var(--text);
        }

        #status.ok {
            color: #4a4;
        }

        #status.err {
            color: #a44;
        }

        .layout {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        /* ── ペースト入力 ── */
        #input-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            color: var(--text);
        }

        textarea {
            width: 100%;
            height: 480px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: #9cf;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            padding: 10px;
            resize: vertical;
            outline: none;
            border-radius: 3px;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 5px 14px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-hi);
            cursor: pointer;
            border-radius: 3px;
            letter-spacing: .04em;
            transition: border-color .15s, color .15s;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── 左右の列 ──
           左: 上の段（OLED と、その右隣のアニメの操作・zoom）→ 貼り付け欄。右: ツリー・貼り付けた候補・没候補。
           狭い画面では、2 列が横に並べなければ縦に折り返し、ページ全体をスクロールする。 */
        #left-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1 1 860px;
            min-width: 280px;
        }

        #right-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1 1 460px;
            min-width: 0;
        }

        .section-label {
            font-size: 10px;
            color: var(--text);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        /* ── OLED風ディスプレイ ── */
        .oled-outer {
            background: #181c20;
            border: 2px solid #2a2e34;
            border-radius: 8px;
            padding: 20px 24px 16px;
            display: inline-flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .04);
        }

        .oled-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #3a4a5a;
            letter-spacing: .1em;
        }

        .oled-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1a3a1a;
        }

        .oled-wrap {
            background: #020608;
            border: 2px solid #0a1a28;
            border-radius: 3px;
            box-shadow:
                inset 0 0 12px rgba(0, 0, 0, .8),
                0 0 0 1px #000,
                0 0 40px rgba(74, 170, 255, .12),
                0 0 80px rgba(74, 170, 255, .04);
            padding: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            image-rendering: pixelated;
            display: block;
        }

        /* ── スプライト一覧 ── */
        #sprite-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sprite-card,
        .cand-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            cursor: pointer;
            transition: border-color .15s;
        }

        .sprite-card:hover,
        .sprite-card.active,
        .cand-card:hover,
        .cand-card.active {
            border-color: var(--accent);
        }

        .sprite-card canvas,
        .cand-card canvas {
            image-rendering: pixelated;
        }

        .sprite-card .name,
        .cand-card .name {
            font-size: 9px;
            color: var(--text);
            letter-spacing: .04em;
            max-width: 80px;
            text-align: center;
            word-break: break-all;
        }

        /* ── アニメ コントロール ── */
        .anim-ctrl {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .anim-ctrl select,
        .anim-ctrl input[type=range] {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text-hi);
            padding: 3px 6px;
            border-radius: 3px;
        }

        /* ── ピクセルグリッド拡大 ── */
        #zoom-wrap {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .zoom-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .zoom-label {
            font-size: 9px;
            color: var(--text);
            letter-spacing: .06em;
        }

        /* ── 進化ツリー（ゲーム本体のスプライト） ── */
        /* 列: 系統名 / ベビー / 若羊 / 成体 / 特殊成長。行: 見出し + 3 系統 */
        #evo-tree {
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            gap: 10px 14px;
            align-items: center;
            justify-content: start;
        }

        .evo-head {
            font-size: 10px;
            color: var(--text);
            letter-spacing: .1em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .evo-head.arrow::before {
            content: "→ ";
            color: #345;
        }

        .evo-family {
            font-size: 10px;
            color: var(--text-hi);
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .evo-cell {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .evo-node {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            cursor: pointer;
            transition: border-color .15s;
        }

        .evo-node:hover {
            border-color: var(--accent);
        }

        /* 選択中のフォームの親（進化元）と子（進化先）を薄く示す */
        .evo-node.ancestor {
            border-color: #2a6a9a;
        }

        .evo-node.child {
            border-color: #2a6a9a;
            border-style: dashed;
        }

        .evo-node.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .evo-node .label {
            font-size: 10px;
            color: var(--text-hi);
            text-align: center;
            max-width: 92px;
        }

        .evo-node .id {
            font-size: 8px;
            color: #556;
            letter-spacing: .02em;
            max-width: 92px;
            text-align: center;
            word-break: break-all;
        }

        #lineage {
            font-size: 11px;
            color: var(--text-hi);
            margin-top: 8px;
            min-height: 16px;
        }

        #evo-note {
            font-size: 10px;
            color: #a44;
        }

        /* ── 没候補 ── */
        .cand-topic {
            font-size: 10px;
            color: var(--text-hi);
            letter-spacing: .06em;
            margin: 10px 0 6px;
        }

        .cand-topic:first-child {
            margin-top: 0;
        }

        .cand-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ── OLED の表示サイズ ──
           キャンバスは 768x384 で描き、CSS で表示の大きさを変える。縮めるのは 2/3・1/2 だけにして、
           1 ドットが整数ピクセルになるようにし、ドットが崩れないようにする。 */
        :root {
            --oled-w: 768px;
            --right-w: 940px;   /* 右の列の幅。ツリー（約 920px）が収まる幅 */
        }

        #oled {
            width: var(--oled-w);
            height: calc(var(--oled-w) / 2);
        }

        /* 左の上の段: OLED と、その右隣（アニメの操作・zoom）。幅が足りなければ、右隣は OLED の下に折り返す */
        #top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 24px;
            align-items: flex-start;
        }

        #oled-block {
            flex: none;
        }

        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1 1 240px;
            min-width: 0;
        }

        .anim-ctrl select {
            flex: 1 1 100%;
            min-width: 0;
        }

        #scroll-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 幅 900px 未満では、OLED は最小（384px）にする */
        @media (max-width: 899px) {
            :root {
                --oled-w: 384px;
            }
        }

        /* ── 画面が広く高いとき: 画面いっぱいに使い、ページ自体はスクロールさせない ──
           幅 1280px 以上・高さ 640px 以上のときだけ。これより狭い・低い画面は、ページ全体をスクロールする従来の表示のまま。 */
        @media (min-width: 1280px) and (min-height: 640px) {
            body {
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            header {
                flex: none;
            }

            #scroll-area {
                overflow-y: auto;
                min-height: 0;
                padding: 14px 10px 0 0;
                border-top: 1px solid var(--border);
                scrollbar-width: thin;
                scrollbar-color: #2a3a4a transparent;
            }

            /* 貼り付け欄は、あいている縦いっぱいに伸ばす（エディタとして使うため） */
            #input-col textarea {
                flex: 1 1 auto;
                height: auto;
                min-height: 120px;
                resize: none;
            }
        }

        /* 広い画面（幅 1870px 以上 = 左に、OLED（512px の枠 588px）とその右隣（240px）が横に並べる幅）:
           右の列は、ツリーが収まる幅（940px）に絞り、残りを左に回す。
           左 = 上の段（OLED と右隣）+ 貼り付け欄（広く・高く使う）、右 = スクロールエリア */
        @media (min-width: 1870px) and (min-height: 640px) {
            :root {
                --oled-w: 512px;
            }

            .layout {
                flex: 1 1 auto;
                min-height: 0;
                flex-wrap: nowrap;
            }

            #left-col {
                flex: 1 1 auto;
                min-width: 0;
                min-height: 0;
                overflow-y: auto;
            }

            #input-col {
                flex: 1 1 auto;
                min-height: 220px;
            }

            #right-col {
                flex: 0 0 var(--right-w);
                min-width: 0;
                min-height: 0;
            }

            #scroll-area {
                flex: 1 1 auto;
                border-top: none;
                padding-top: 0;
            }
        }

        /* 最大（768px）にするのは、左に OLED の枠（844px）と右隣（240px）が並ぶ幅（2130px 以上）と、
           貼り付け欄が残る高さがあるときだけ */
        @media (min-width: 2130px) and (min-height: 1040px) {
            :root {
                --oled-w: 768px;
            }
        }

        @media (min-width: 1870px) and (min-height: 640px) and (max-height: 719px) {
            :root {
                --oled-w: 384px;
            }
        }

        /* 中くらいの画面（幅 1280〜1869px）: 左は貼り付け欄のみ（縦いっぱい）。右の上に、OLED と、その右隣
           （アニメの操作・zoom）を固定して並べ、その下だけスクロールする。 */
        @media (min-width: 1280px) and (max-width: 1869px) and (min-height: 640px) {
            :root {
                --oled-w: 512px;
            }

            .layout {
                flex: 1 1 auto;
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(260px, 1fr) var(--right-w);
                grid-template-rows: auto minmax(0, 1fr);
                grid-template-areas: "input top" "input scroll";
                gap: 14px 24px;
            }

            #left-col,
            #right-col {
                display: contents;
            }

            #top-row {
                grid-area: top;
            }

            #input-col {
                grid-area: input;
                min-height: 0;
                overflow-y: auto;
            }

            #scroll-area {
                grid-area: scroll;
            }
        }

        @media (min-width: 1280px) and (max-width: 1869px) and (min-height: 640px) and (max-height: 899px) {
            :root {
                --oled-w: 384px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>mokoji / OLED preview</h1>
        <span id="status">待機中</span>
    </header>

    <div class="layout">

        <!-- 左: 上の段 = OLED とその右隣（アニメの操作・zoom）、下 = 貼り付け欄 -->
        <div id="left-col">

            <div id="top-row">

                <!-- OLED シミュレータ -->
                <div id="oled-block">
                    <div class="section-label">OLED simulator</div>
                    <div class="oled-outer">
                        <div class="oled-label-row">
                            <span>SSD1306 · 0.96" · 128×64</span>
                            <div class="oled-dot" id="power-dot"></div>
                        </div>
                        <div class="oled-wrap">
                            <canvas id="oled" width="768" height="384"></canvas>
                        </div>
                        <div class="oled-label-row" style="justify-content:center;font-size:9px;letter-spacing:.14em">
                            mokoji device
                        </div>
                    </div>
                </div>

                <!-- OLED の右隣: アニメの操作と zoom -->
                <div id="side-panel">
                    <div>
                        <div class="section-label">animation</div>
                        <div class="anim-ctrl">
                            <select id="anim-sel" onchange="onAnimSelChange()"></select>
                            <button id="btn-play" onclick="togglePlay()">▶ play</button>
                            <span>fps</span>
                            <input type="range" id="fps" min="1" max="16" value="4" oninput="restartTimer()">
                        </div>
                        <div id="lineage"></div>
                    </div>

                    <!-- ズーム比較 -->
                    <div>
                        <div class="section-label">zoom — 1x / 2x / 4x</div>
                        <div id="zoom-wrap"></div>
                    </div>
                </div>
            </div>

            <!-- 貼り付け欄 -->
            <div id="input-col">
                <label>候補スプライトをここにペースト（tuple / _img() 両対応）。ゲーム本体の分は右のツリーに自動で出る</label>
                <textarea id="src" spellcheck="false" placeholder='HITSUJI = (
    "........................",
    "......###########.......",
    ...
)

# または _img() 形式も可
LAMB_F = _img(
    "........................",
    ...
)'></textarea>
                <div class="btn-row">
                    <button class="primary" onclick="parse()">▶ parse &amp; preview</button>
                    <button onclick="clearAll()">clear</button>
                    <button onclick="loadSample()">load sample</button>
                    <button onclick="loadGameSprites()">load game sprites</button>
                </div>
                <div id="parse-log" style="font-size:10px;color:#666;margin-top:4px;line-height:1.7"></div>
            </div>
        </div>

        <!-- 右: ツリー・貼り付けた候補・没候補（ここだけスクロール） -->
        <div id="right-col">
            <div id="scroll-area">

                <!-- 進化ツリー（oled_preview_data.js から自動表示） -->
                <div>
                    <div class="section-label">evolution tree — game sprites</div>
                    <div id="evo-tree"></div>
                    <div id="evo-note"></div>
                </div>

                <!-- スプライト一覧（貼り付けた候補） -->
                <div>
                    <div class="section-label">pasted sprites — 貼り付けた候補</div>
                    <div id="sprite-list"></div>
                </div>

                <!-- 没候補（docs/sprite-candidates の未採用・外した・旧デザイン） -->
                <div>
                    <div class="section-label">rejected candidates — 没候補（docs/sprite-candidates）</div>
                    <div id="cand-list"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- python3 sprites_gen.py が生成。無くてもペースト機能は使える（file:// でも読める） -->
    <script src="oled_preview_data.js"></script>
    <script>
        const LS_SRC = 'mokoji_src';
        const LS_SEL = 'mokoji_selected';

        // 旧名（mokomoko_*）で保存した貼り付けと選択を引き継ぐ（1 回だけ）
        try {
            [['mokomoko_src', LS_SRC], ['mokomoko_selected', LS_SEL]].forEach(([oldKey, newKey]) => {
                const v = localStorage.getItem(oldKey);
                if (v !== null && localStorage.getItem(newKey) === null) localStorage.setItem(newKey, v);
                localStorage.removeItem(oldKey);
            });
        } catch (e) { }

        // 貼り付けた候補スプライト（名前 → 0/1 の 24x24）
        let sprites = {};
        // ゲーム本体のスプライト（oled_preview_data.js）
        const DATA = window.MOKOJI_DATA || null;
        const forms = DATA ? DATA.forms : [];
        const formById = {};       // id → form
        const formBits = {};       // id → { F, L, R }（0/1 の 24x24）
        // 現在の選択。{ kind: 'form', id } か { kind: 'sprite', name }
        let current = null;
        let animTimer = null;
        let animFrame = 0;
        let playing = false;

        // ゲーム内の向き。歩行アニメは 正面 → 左 → 正面 → 右 の順に回す
        const WALK_FRAMES = ['F', 'L', 'F', 'R'];

        function toBits(rows) {
            return rows.map(r => [...r].map(c => c === '#' ? 1 : 0));
        }
        forms.forEach(f => {
            formById[f.id] = f;
            formBits[f.id] = { F: toBits(f.frames.F), L: toBits(f.frames.L), R: toBits(f.frames.R) };
        });

        // docs/sprite-candidates の候補。表示に使うのは没候補（未採用・外した・旧デザイン）だけ。
        // 採用済みの案は、ゲーム本体のスプライトとしてツリーに出ている
        const candsAll = DATA && DATA.candidates ? DATA.candidates : [];
        const candById = {};
        const candBits = {};
        candsAll.forEach(c => { candById[c.id] = c; candBits[c.id] = toBits(c.rows); });
        const candsRejected = candsAll.filter(c => c.kind === 'rejected');

        // ── localStorage ──────────────────────────────
        function saveSrc() {
            try { localStorage.setItem(LS_SRC, document.getElementById('src').value); } catch (e) { }
        }
        function saveSel(name) {
            try { localStorage.setItem(LS_SEL, name); } catch (e) { }
        }
        function clearStorage() {
            try { localStorage.removeItem(LS_SRC); localStorage.removeItem(LS_SEL); } catch (e) { }
        }

        // ── パーサ ──────────────────────────────────────
        function parseSrc(src) {
            const result = {};
            const tupleRe = /([A-Z][A-Z0-9_]*)\s*=\s*[\(\[]([\s\S]*?)[\)\]]/g;
            const imgRe = /([A-Z][A-Z0-9_]*)\s*=\s*_img\s*\(([\s\S]*?)\)/g;

            function extractRows(body) {
                const rows = [];
                const re = /"([^"]{1,32})"/g;
                let m;
                while ((m = re.exec(body)) !== null) {
                    const s = m[1].padEnd(24, '.').slice(0, 24);
                    rows.push([...s].map(c => c === '#' ? 1 : 0));
                }
                return rows.length === 24 ? rows : null;
            }

            for (const re of [tupleRe, imgRe]) {
                let m;
                while ((m = re.exec(src)) !== null) {
                    const rows = extractRows(m[2]);
                    if (rows) result[m[1]] = rows;
                }
            }
            return result;
        }

        // ── 描画ヘルパー ──────────────────────────────────
        function drawSprite(ctx, sp, scale, ox = 0, oy = 0, fg = '#c8e8ff', bg = '#050d14') {
            ctx.fillStyle = bg;
            ctx.fillRect(ox, oy, 24 * scale, 24 * scale);
            ctx.fillStyle = fg;
            for (let y = 0; y < 24; y++)
                for (let x = 0; x < 24; x++)
                    if (sp[y][x]) ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
        }

        function drawOLED(sp) {
            const c = document.getElementById('oled');
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#020608';
            ctx.fillRect(0, 0, 768, 384);
            if (!sp) return;
            const SCALE = 6, W = 768, H = 384;
            const ox = Math.round((W - 24 * SCALE) / 2);
            const oy = Math.round((H - 24 * SCALE) / 2);
            ctx.fillStyle = '#c8e8ff';
            for (let y = 0; y < 24; y++)
                for (let x = 0; x < 24; x++)
                    if (sp[y][x]) ctx.fillRect(ox + x * SCALE, oy + y * SCALE, SCALE, SCALE);
            // グロー
            ctx.globalAlpha = 0.12;
            ctx.filter = 'blur(6px)';
            ctx.fillStyle = '#a0d0ff';
            for (let y = 0; y < 24; y++)
                for (let x = 0; x < 24; x++)
                    if (sp[y][x]) ctx.fillRect(ox + x * SCALE - 3, oy + y * SCALE - 3, SCALE + 6, SCALE + 6);
            ctx.globalAlpha = 1;
            ctx.filter = 'none';
            // スキャンライン
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
            document.getElementById('power-dot').style.background = '#2a6a2a';
        }

        // ── スプライトカード（貼り付けた候補） ──────────────────
        function buildSpriteList() {
            const list = document.getElementById('sprite-list');
            list.innerHTML = '';

            Object.entries(sprites).forEach(([name, sp]) => {
                const card = document.createElement('div');
                const isCurrent = current && current.kind === 'sprite' && current.name === name;
                card.className = 'sprite-card' + (isCurrent ? ' active' : '');
                const c = document.createElement('canvas');
                c.width = 48; c.height = 48;
                c.style.cssText = 'width:48px;height:48px;background:#050d14';
                drawSprite(c.getContext('2d'), sp, 2, 0, 0);
                const label = document.createElement('div');
                label.className = 'name';
                label.textContent = name;
                card.appendChild(c);
                card.appendChild(label);
                card.addEventListener('click', () => selectSprite(name));
                list.appendChild(card);
            });

            rebuildAnimSelect();
        }

        // ── 進化ツリー（ゲーム本体のスプライト） ──────────────────
        // 進化元（親）: ベビー → 若羊（系統） → 成体（品種） → 特殊成長（増毛・角長）
        function parentOf(f) {
            switch (f.stage) {
                case 'YOUNG': return forms.find(x => x.stage === 'BABY') || null;
                case 'ADULT': return forms.find(x => x.stage === 'YOUNG' && x.family === f.family) || null;
                case 'SPECIAL': return forms.find(x => x.stage === 'ADULT' && x.breed === f.breed) || null;
                default: return null;
            }
        }
        function ancestorsOf(f) {
            const out = [];
            for (let p = parentOf(f); p; p = parentOf(p)) out.unshift(p);
            return out;
        }
        function childrenOf(f) {
            return forms.filter(x => { const p = parentOf(x); return p && p.id === f.id; });
        }
        function lineageText(f) {
            return [...ancestorsOf(f), f].map(x => x.label).join(' → ');
        }

        function makeNode(f) {
            const node = document.createElement('div');
            node.className = 'evo-node';
            node.dataset.id = f.id;
            node.title = f.id;
            const c = document.createElement('canvas');
            c.width = 48; c.height = 48;
            c.style.cssText = 'width:48px;height:48px;background:#050d14';
            drawSprite(c.getContext('2d'), formBits[f.id].F, 2, 0, 0);
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = f.label;
            const id = document.createElement('div');
            id.className = 'id';
            id.textContent = f.id;
            node.appendChild(c); node.appendChild(label); node.appendChild(id);
            node.addEventListener('click', () => selectForm(f.id));
            return node;
        }

        function buildTree() {
            const tree = document.getElementById('evo-tree');
            const note = document.getElementById('evo-note');
            tree.innerHTML = '';
            if (!DATA) {
                note.textContent = 'oled_preview_data.js が見つかりません。python3 sprites_gen.py で生成してください（貼り付けは今までどおり使えます）';
                return;
            }
            note.textContent = '';

            // 列: 1 = 系統名 / 2.. = 成長段階。行: 1 = 見出し / 2.. = 系統
            const stageCol = {};
            DATA.stages.forEach((s, i) => {
                stageCol[s.id] = i + 2;
                const h = document.createElement('div');
                h.className = 'evo-head' + (i > 0 ? ' arrow' : '');
                h.textContent = s.label;
                h.style.gridColumn = i + 2;
                h.style.gridRow = 1;
                tree.appendChild(h);
            });
            const familyRow = {};
            DATA.families.forEach((fam, i) => {
                familyRow[fam.id] = i + 2;
                const l = document.createElement('div');
                l.className = 'evo-family';
                l.textContent = fam.label;
                l.style.gridColumn = 1;
                l.style.gridRow = i + 2;
                tree.appendChild(l);
            });

            // 段階 × 系統 のセルにノードを並べる。ベビーは全系統共通なので縦に結合する
            const cells = {};
            const cellFor = (stage, family) => {
                const key = stage + '/' + family;
                if (!cells[key]) {
                    const c = document.createElement('div');
                    c.className = 'evo-cell';
                    c.style.gridColumn = stageCol[stage];
                    c.style.gridRow = family ? familyRow[family] : `2 / span ${DATA.families.length}`;
                    tree.appendChild(c);
                    cells[key] = c;
                }
                return cells[key];
            };
            forms.forEach(f => cellFor(f.stage, f.family).appendChild(makeNode(f)));
        }

        // 選択中のフォームと、その進化元（ancestor）・進化先（child）をツリー上で示す
        function markTree() {
            const f = current && current.kind === 'form' ? formById[current.id] : null;
            const anc = new Set(f ? ancestorsOf(f).map(x => x.id) : []);
            const kids = new Set(f ? childrenOf(f).map(x => x.id) : []);
            document.querySelectorAll('.evo-node').forEach(el => {
                const id = el.dataset.id;
                el.classList.toggle('active', !!f && id === f.id);
                el.classList.toggle('ancestor', anc.has(id));
                el.classList.toggle('child', kids.has(id));
            });
        }

        // ── アニメ セレクト（ゲーム本体 form:ID / 貼り付け sprite:NAME） ──
        function currentKey() {
            if (!current) return '';
            if (current.kind === 'form') return 'form:' + current.id;
            if (current.kind === 'cand') return 'cand:' + current.id;
            return 'sprite:' + current.name;
        }
        function syncAnimSelect() {
            document.getElementById('anim-sel').value = currentKey();
        }
        function rebuildAnimSelect() {
            const sel = document.getElementById('anim-sel');
            sel.innerHTML = '';
            const addGroup = (label, items) => {
                if (!items.length) return;
                const g = document.createElement('optgroup');
                g.label = label;
                items.forEach(([value, text]) => {
                    const o = document.createElement('option');
                    o.value = value;
                    o.textContent = text;
                    g.appendChild(o);
                });
                sel.appendChild(g);
            };
            addGroup('game', forms.map(f => ['form:' + f.id, `${f.id} — ${f.label}`]));
            addGroup('pasted', Object.keys(sprites).map(n => ['sprite:' + n, n]));
            addGroup('rejected candidates', candsRejected.map(c => ['cand:' + c.id, `${c.topicLabel} ${c.short}`]));
            syncAnimSelect();
        }
        function selectByKey(key) {
            if (key.startsWith('form:') && formById[key.slice(5)]) selectForm(key.slice(5));
            else if (key.startsWith('sprite:') && sprites[key.slice(7)]) selectSprite(key.slice(7));
            else if (key.startsWith('cand:') && candById[key.slice(5)]) selectCand(key.slice(5));
        }
        function onAnimSelChange() {
            selectByKey(document.getElementById('anim-sel').value);
        }

        function buildZoom(sp) {
            const wrap = document.getElementById('zoom-wrap');
            wrap.innerHTML = '';
            [1, 2, 4].forEach(s => {
                const div = document.createElement('div');
                div.className = 'zoom-item';
                const c = document.createElement('canvas');
                c.width = 24 * s; c.height = 24 * s;
                c.style.cssText = `width:${24 * s}px;height:${24 * s}px;background:#050d14;border:1px solid #1a3a5a`;
                drawSprite(c.getContext('2d'), sp, s, 0, 0);
                const lb = document.createElement('div');
                lb.className = 'zoom-label';
                lb.textContent = `${s}x`;
                div.appendChild(c); div.appendChild(lb);
                wrap.appendChild(div);
            });
        }

        function selectSprite(name) {
            current = { kind: 'sprite', name };
            document.querySelectorAll('.sprite-card').forEach(el => {
                el.classList.toggle('active', el.querySelector('.name').textContent === name);
            });
            document.querySelectorAll('.cand-card').forEach(el => el.classList.remove('active'));
            markTree();
            document.getElementById('lineage').textContent = '';
            drawOLED(sprites[name]);
            buildZoom(sprites[name]);
            animFrame = 0;
            syncAnimSelect();
            saveSel(currentKey()); // 選択をlocalStorageに保存
        }

        function selectForm(id) {
            current = { kind: 'form', id };
            document.querySelectorAll('.sprite-card, .cand-card').forEach(el => el.classList.remove('active'));
            markTree();
            document.getElementById('lineage').textContent = lineageText(formById[id]);
            const sp = formBits[id].F;
            drawOLED(sp);
            buildZoom(sp);
            animFrame = 0;
            syncAnimSelect();
            saveSel(currentKey());
        }

        // ── 没候補（docs/sprite-candidates） ──────────────────
        function buildCandidates() {
            const list = document.getElementById('cand-list');
            list.innerHTML = '';
            if (!DATA) return;
            DATA.topics.forEach(topic => {
                const items = candsRejected.filter(c => c.topic === topic.id);
                if (!items.length) return;
                const head = document.createElement('div');
                head.className = 'cand-topic';
                head.textContent = `${topic.label}（${items.length}）`;
                const cards = document.createElement('div');
                cards.className = 'cand-cards';
                items.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'cand-card';
                    card.dataset.id = c.id;
                    card.title = `${c.id}\n${c.feature}\n${c.status}`;
                    const cv = document.createElement('canvas');
                    cv.width = 48; cv.height = 48;
                    cv.style.cssText = 'width:48px;height:48px;background:#050d14';
                    drawSprite(cv.getContext('2d'), candBits[c.id], 2, 0, 0);
                    const label = document.createElement('div');
                    label.className = 'name';
                    label.textContent = c.short;
                    card.appendChild(cv); card.appendChild(label);
                    card.addEventListener('click', () => selectCand(c.id));
                    cards.appendChild(card);
                });
                list.appendChild(head);
                list.appendChild(cards);
            });
        }

        function selectCand(id) {
            current = { kind: 'cand', id };
            const c = candById[id];
            document.querySelectorAll('.sprite-card').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.cand-card').forEach(el => el.classList.toggle('active', el.dataset.id === id));
            markTree();
            document.getElementById('lineage').textContent = `${c.topicLabel} › ${c.short}: ${c.feature}（${c.status}）`;
            drawOLED(candBits[id]);
            buildZoom(candBits[id]);
            animFrame = 0;
            syncAnimSelect();
            saveSel(currentKey());
        }

        // ── ゲーム本体のスプライトを貼り付け欄に読み込む（load sample の、ゲーム本体版） ──
        // 各フォームの正面（F）を、フォーム名の NAME = ( … ) で入れる。直して parse すると、見た目を試せる
        function loadGameSprites() {
            const status = document.getElementById('status');
            if (!forms.length) {
                status.textContent = 'ゲーム本体のスプライトがありません（oled_preview_data.js が必要）';
                status.className = 'err';
                return;
            }
            document.getElementById('src').value = forms.map(f =>
                `${f.id} = (\n` + f.frames.F.map(r => `    "${r}",\n`).join('') + ')').join('\n\n');
            parse();
        }

        // ── アニメ ──────────────────────────────────────
        // 貼り付け候補用: 名前の前方一致で似たスプライトを集める
        function getAnimNames() {
            const sel = current && current.kind === 'sprite' ? current.name : '';
            const base = sel.replace(/[_]?[FLR\d]+$/, '');
            const group = Object.keys(sprites).filter(n => n.startsWith(base) || n === sel);
            return group.length >= 2 ? group : Object.keys(sprites).slice(0, Math.min(4, Object.keys(sprites).length));
        }

        function tickAnim() {
            if (current && current.kind === 'cand') return;   // 没候補は静止画（フレームは 1 つ）
            if (current && current.kind === 'form') {
                // ゲーム本体: フォームの 正面 → 左 → 正面 → 右 を回す
                animFrame = (animFrame + 1) % WALK_FRAMES.length;
                const k = WALK_FRAMES[animFrame];
                drawOLED(formBits[current.id][k]);
                return;
            }
            const names = getAnimNames();
            if (!names.length) return;
            animFrame = (animFrame + 1) % names.length;
            drawOLED(sprites[names[animFrame]]);
        }

        function togglePlay() {
            playing = !playing;
            document.getElementById('btn-play').textContent = playing ? '⏹ stop' : '▶ play';
            if (playing) restartTimer(); else { clearInterval(animTimer); animTimer = null; }
        }

        function restartTimer() {
            clearInterval(animTimer);
            if (!playing) return;
            const fps = parseInt(document.getElementById('fps').value) || 4;
            animTimer = setInterval(tickAnim, 1000 / fps);
        }

        // ── parse ──────────────────────────────────────
        function parse() {
            const src = document.getElementById('src').value;
            const log = document.getElementById('parse-log');
            const status = document.getElementById('status');

            if (!src.trim()) {
                status.textContent = 'テキストが空です';
                status.className = 'err';
                return;
            }

            // parse前の選択（貼り付け候補）を記憶
            const prevSelected = current && current.kind === 'sprite' ? current.name : null;

            sprites = parseSrc(src);
            const names = Object.keys(sprites);

            if (!names.length) {
                status.textContent = 'スプライトが見つかりませんでした';
                status.className = 'err';
                log.textContent = '形式を確認: NAME = ( "###...", ... ) か _img("###...", ...) ';
                return;
            }

            status.textContent = `✓ ${names.length} sprites loaded`;
            status.className = 'ok';
            log.textContent = names.join('  ');

            saveSrc(); // localStorageに保存

            buildSpriteList();

            // 以前の選択が引き続き存在すれば維持、なければ先頭
            const toSelect = (prevSelected && sprites[prevSelected]) ? prevSelected : names[0];
            selectSprite(toSelect);
        }

        function clearAll() {
            // 消すのは貼り付けた候補だけ。ゲーム本体のツリーは残す
            const keepForm = current && current.kind === 'form' ? current.id : null;
            document.getElementById('src').value = '';
            sprites = {};
            current = null;
            document.getElementById('sprite-list').innerHTML = '';
            document.getElementById('zoom-wrap').innerHTML = '';
            document.getElementById('lineage').textContent = '';
            document.getElementById('parse-log').textContent = '';
            document.getElementById('status').textContent = forms.length ? `✓ ${forms.length} forms（ゲーム本体）` : '待機中';
            document.getElementById('status').className = forms.length ? 'ok' : '';
            rebuildAnimSelect();
            markTree();
            clearStorage();
            if (keepForm) selectForm(keepForm);
            else if (forms.length) selectForm(forms[0].id);
            else drawOLED(null);
        }

        function loadSample() {
            document.getElementById('src').value = `HITSUJI = (
    "........................",
    "........................",
    "........................",
    "........................",
    "..........#.#...........",
    "........#######.........",
    "......###########.......",
    ".....###...#...###......",
    "......#..#####..#.......",
    "...###.#########.###....",
    "......###########.......",
    "....#.#...###...#.#.....",
    "...##.###########.##....",
    "....#.###########.#.....",
    "....##.#########.##.....",
    "....##.###.#.###.##.....",
    ".....##.###.###.##......",
    ".....###.......###......",
    "......###########.......",
    "........##..#.#.........",
    "........................",
    "........................",
    "........................",
    "........................",
)`;
            parse();
        }

        // ── 起動: ツリーを作り、localStorageから復元 ──────────────────
        drawOLED(null);

        document.getElementById('src').addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parse();
        });

        // 入力のたびに随時保存
        document.getElementById('src').addEventListener('input', saveSrc);

        buildTree();
        buildCandidates();

        // 起動時に保存済みの貼り付けと選択を復元（ゲーム本体のスプライトは data.js から常に読む）
        let savedSel = null;
        try {
            const savedSrc = localStorage.getItem(LS_SRC);
            savedSel = localStorage.getItem(LS_SEL);
            if (savedSrc) {
                document.getElementById('src').value = savedSrc;
                sprites = parseSrc(savedSrc);
            }
        } catch (e) { }

        const pastedNames = Object.keys(sprites);
        const statusParts = [];
        if (forms.length) statusParts.push(`${forms.length} forms（ゲーム本体）`);
        if (candsRejected.length) statusParts.push(`${candsRejected.length} 没候補`);
        if (pastedNames.length) statusParts.push(`${pastedNames.length} sprites restored（貼り付け）`);
        if (statusParts.length) {
            document.getElementById('status').textContent = '✓ ' + statusParts.join(' + ');
            document.getElementById('status').className = 'ok';
        }
        if (pastedNames.length) document.getElementById('parse-log').textContent = pastedNames.join('  ');

        buildSpriteList();

        // 選択の復元。旧版は名前だけを保存していたので、接頭辞が無ければ貼り付け候補の名前として扱う
        if (savedSel) selectByKey(/^(form|sprite|cand):/.test(savedSel) ? savedSel : 'sprite:' + savedSel);
        if (!current) {
            if (forms.length) selectForm(forms[0].id);
            else if (pastedNames.length) selectSprite(pastedNames[0]);
        }
    </script>
</body>

</html>
